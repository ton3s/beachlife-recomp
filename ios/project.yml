# Xcode wrapper for iPad and the iPad simulator. Regenerate with: xcodegen --spec ios/project.yml
# CMake still builds the game (ios/build-game.sh); Xcode installs, signs, runs and debugs it.
name: BeachLife
options:
  bundleIdPrefix: org.beachlife
  deploymentTarget: {iOS: "17.0"}
targets:
  BeachLife:
    type: application
    supportedDestinations: [iOS]
    sources: [{path: stub.c}, {path: Assets.xcassets}]
    settings:
      base:
        PRODUCT_NAME: beachlife
        PRODUCT_BUNDLE_IDENTIFIER: com.appdesign.beachlife
        INFOPLIST_FILE: Info.plist
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        DEVELOPMENT_TEAM: PNKNRE7W69
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: YES
        CODE_SIGN_STYLE: Automatic
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Development
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        GENERATE_INFOPLIST_FILE: NO
        DEBUG_INFORMATION_FORMAT: dwarf
        ENABLE_DEBUG_DYLIB: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: NO
    postBuildScripts:
      - name: Build game with CMake
        script: exec "$SRCROOT/build-game.sh"
        basedOnDependencyAnalysis: false
schemes:
  BeachLife:
    build: {targets: {BeachLife: all}}
    run:
      config: Debug
      environmentVariables:
        BEACHLIFE_IOS_ISO: "${HOME}/Desktop/learning/beach-life/Beach_Life_Win_ISO_EN/Game Files/Beachlife.iso"
